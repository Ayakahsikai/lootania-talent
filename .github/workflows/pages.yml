# 把 talent/ 發佈成 GitHub Pages 網站：
#   talent/  →  網站根目錄    https://<帳號>.github.io/<repo>/        （天賦網址維持不變）
# 使用前：Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查天賦資料
        run: |
          set -euo pipefail
          test -f talent/index.html || { echo "::error::找不到 talent/index.html"; exit 1; }
          test -f talent/boards/index.json || { echo "::error::找不到 talent/boards/index.json"; exit 1; }
          python3 - <<'PY'
          import json, sys
          m = json.load(open('talent/boards/index.json', encoding='utf-8'))
          errs = []
          boards = m.get('boards', [])
          vers = [b.get('version') for b in boards]
          if not vers: errs.append('boards/index.json 沒有任何版本')
          # aliases：內容沒變、只是遊戲版本號更新時，舊版本號放在 aliases，沿用同一個天賦盤檔案
          for b in boards:
              al = b.get('aliases', [])
              if not (isinstance(al, list) and all(isinstance(a, str) and a for a in al)):
                  errs.append(f"{b.get('version')}: aliases 要是版本名稱的陣列"); b['aliases'] = []
          names = vers + [a for b in boards for a in b.get('aliases') or []]
          dup = sorted({str(x) for x in names if names.count(x) > 1})
          if dup: errs.append(f"版本號重複（version 或 aliases）：{'、'.join(dup)}")
          if m.get('latest') not in names: errs.append(f"latest「{m.get('latest')}」不在 boards 清單（或 aliases）裡")
          for b in boards:
              try:
                  d = json.load(open('talent/boards/' + b['file'], encoding='utf-8'))
              except Exception as e:
                  errs.append(f"{b.get('file')}: 無法讀取（{e}）"); continue
              ok = [b.get('version')] + (b.get('aliases') or [])
              if d.get('version') not in ok:
                  errs.append(f"{b['file']}: 檔內 version「{d.get('version')}」與清單「{b.get('version')}」不同，也不在它的 aliases 裡")
              elif d.get('version') != b.get('version'):
                  print(f"{b['file']}: 以「{b.get('version')}」顯示（檔內 {d.get('version')}，列在 aliases）")
          for e in errs: print(f"::error::{e}")
          sys.exit(1 if errs else 0)
          PY

      - name: 組合網站
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a talent/. _site/
          touch _site/.nojekyll
          echo "網站內容："; find _site -maxdepth 2 | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
